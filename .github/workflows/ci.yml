name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest needs Node 22.12+; Node 20 is covered by the package job.
        node-version: ["22", "24", "26"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  package:
    name: Validate package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack

      - name: Set up the oldest supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.3"

      - name: Test the packed package
        run: |
          mkdir /tmp/xapikorea-package-test
          cp xapikorea-*.tgz /tmp/xapikorea-package-test/
          cd /tmp/xapikorea-package-test
          npm init -y
          npm install ./xapikorea-*.tgz
          node --input-type=module -e "import { XAPIKorea, VERSION } from 'xapikorea'; new XAPIKorea('enc_test'); console.log(VERSION)"
